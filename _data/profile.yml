short_bio: >-
  <p>
    I am a final-year Honors Program undergraduate student in Information Technology at
    <a class="bio-org" href="https://hcmus.edu.vn/" target="_blank">VNUHCM - University of Science</a>.
    My research focuses on <span class="bio-topic">multimodal and robust perception</span>,
    <span class="bio-topic">generative models</span>, and
    <span class="bio-topic">mixture-of-experts architectures</span>,
    toward visual AI systems that remain reliable in real-world applications.
  </p>
  <p>
    At VNUHCM - University of Science, I am a research assistant at the
    <strong>Multimedia Synergy Lab (MSLab)</strong>, working on culturally grounded
    text-to-image generation with
    <a class="bio-person" href="https://ltnghia.github.io/" target="_blank">Dr. Trung-Nghia Le</a> and
    <a class="bio-person" href="https://www.fit.hcmus.edu.vn/~tmtriet" target="_blank">Assoc. Prof. Minh-Triet Tran</a>.
  </p>
  <p>
    Separately, I lead the independent <strong>Mixture of Multimodal Experts (MoME)</strong> research group,
    where I work on efficient expert-based architectures for medical image analysis with
    <a class="bio-person" href="https://nhatptnk8912.github.io/" target="_blank">Assoc. Prof. Nhat Ho</a>
    and on robust multimodal 3D perception with
    <a class="bio-person" href="https://www.cogniboticslab.org/member.php?id=tuandang" target="_blank">Asst. Prof. Tuan Dang</a>.
  </p>

